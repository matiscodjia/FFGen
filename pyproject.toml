[project]
name = "ffgen"
version = "1.0.0"
description = "Focused Feedback Generation - Training pipeline for code feedback embeddings with triplet loss"
authors = [
    {name = "Matis Codjia"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["embeddings", "code", "feedback", "triplet-loss", "machine-learning", "nlp"]

# Core dependencies for training
dependencies = [
    "torch>=2.8.0",
    "transformers>=4.57.1",
    "sentence-transformers>=5.1.1",
    "accelerate>=1.10.1",
    "datasets>=4.2.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "sentencepiece>=0.2.1",
    "pyarrow>=21.0.0",
    "seaborn>=0.13.2",
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "streamlit>=1.51.0",
    "plotly>=6.3.1",
    "openai>=2.7.1",
    "umap>=0.1.1",
    "numpy>=2.3.3",
    "peft>=0.18.0",
]

# Optional dependencies by feature
[project.optional-dependencies]
# Triplet viewer with Streamlit
viewer = [
    "streamlit>=1.30.0",
    "plotly>=6.3.1",
    "umap-learn>=0.5.9.post2",
]

# Data generation with LLMs
generation = [
    "openai>=2.7.1",
    "google-generativeai>=0.8.5",
    "google>=3.0.0",
]

# Monitoring and visualization
monitoring = [
    "tensorboard>=2.20.0",
    "matplotlib>=3.10.7",
]

# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
    "nbformat>=5.10.4",
]

# RAG evaluation
rag = [
    "chromadb>=0.4.0",
]

# Additional analysis tools
analysis = [
    "bertopic>=0.17.3",
    "einops>=0.8.1",
    "pillow>=11.3.0",
]

# All dependencies
all = [
    "ffgen[viewer,generation,monitoring,dev,rag,analysis]"
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# Strict dependency resolution
resolution = "highest"

[tool.ruff]
line-length = 120
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (black handles this)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Research code, less strict
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "sentence_transformers.*",
    "datasets.*",
    "streamlit.*",
    "plotly.*",
    "umap.*",
    "chromadb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
