[project]
name = "ffgen"
version = "1.0.0"
description = "Focused Feedback Generation - Production Ready"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mistralai>=1.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "streamlit>=1.30.0",
    "nbformat>=4.2.0",
    "datasets>=4.4.1",
    "peft>=0.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
