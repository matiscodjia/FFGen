# config.yml
# ===================================================================
#           PANNEAU DE CONTRÔLE DES EXPÉRIMENTATIONS
# ===================================================================

# --- Identification ---
# Changez ceci pour chaque nouvelle expérience
run_id: "Exp-004"

# --- Services d'Inférence ---
inference:
  # Configuration des serveurs d'inférence (llama.cpp, LM Studio, etc.)
  # LLM pour la génération de texte
  llm:
    url: "http://localhost:1234/v1"
    model_name: "llama-3.2-3b-instruct"
    timeout: 5.0
    fallback_model: null  # Optional local model fallback

  # Embeddings pour le negative mining
  embeddings:
    url: "http://localhost:8000/v1"
    model_name: "default"  # Model name on the server
    timeout: 5.0
    fallback_model: "sentence-transformers/all-MiniLM-L6-v2"

# --- Phase 1: Ingestion (Généralement fixe) ---
paths:
  source_code_dir: "./codes"
  # Fichier de sortie de la phase 1 (ne sera généré qu'une fois)
  processed_collection: "./data/processed_collection.parquet"

generation:
  # Le "cerveau" de vos agents
  llm_model: "llama-3.2-3b-instruct"  #"mistralai/Codestral-22B-v0.1"
  batch_size: 8

  # L'entrée de l'agent 1
  anchor_input_column: "code_snippet"

  # Définissez la chaîne d'agents à exécuter
  # Le 'output_col' d'un agent peut être l''input_col' du suivant
  agents:
    - agent: "tutor"
      prompt_file: "./prompts/agent1_tutor.txt"
      input_col: "code_snippet"
      output_col: "generated_feedback"
      
    - agent: "editor"
      prompt_file: "./prompts/agent2_editor.txt"
      input_col: "generated_feedback"
      output_col: "refined_feedback"
      
    # Décommentez pour générer des triplets complets
    - agent: "adversary"
      input_col: "generated_feedback"
      prompt_file: "./prompts/agent3_adversary.txt"
      output_col: "negative_feedback"

    - agent: "conceptual"
      prompt_file: "./prompts/agent4_conceptual.txt"
      input_col: "refined_feedback"
      output_col: "conceptual_feedback"

  # Le fichier de données final, prêt pour l'entraînement
  final_dataset_file: "./data/Exp-002-llama3B_v2.jsonl" # Sera écrasé à chaque run

# --- Phase 2.5: Hard Negative Mining ---
negative_mining:
  enabled: true  # Set to false to disable hard negative mining
  embedding_model: "google/embeddinggemma-300m"  # Model for computing similarities
  # Options: "microsoft/graphcodebert-base", "google/embeddinggemma-300m",
  #          "Salesforce/SFR-Embedding-Code-400M_R", "BAAI/bge-code-v1"
  strategy: "range"  # Options: "hardest" (closest), "semi-hard" (medium), "random", "range"
  min_similarity: 0.30  # Optimal range for triplet margin=0.5: 0.30-0.50
  max_similarity: 0.50  # Negatives should be less similar than the margin
  batch_size: 32  # Batch size for encoding

# --- Phase 3: Entraînement ---
training:
  # 'mnrl' (MultipleNegativesRankingLoss) ou 'triplet' (TripletLoss)
  mode: "triplet" 
  
  base_embedding_model: "google/embeddinggemma-300m"
  # base_embedding_model: "intfloat/multilingual-e5-large"
  # base_embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

  # --- Mappage des colonnes pour l'entraînement ---
  # 'mnrl' utilise 'sentence1' et 'sentence2'
  # 'triplet' utilise 'anchor', 'positive', 'negative'
  data_columns:
    #sentence1: "code_snippet"
    #sentence2: "refined_feedback"
     anchor: "code_snippet"
     positive: "refined_feedback"
     negative: "negative_feedback" 

  # --- Hyperparamètres ---
  hyperparameters:
    num_epochs: 5
    batch_size: 1  # Reduced for MPS memory constraints
    learning_rate: 0.00032
    warmup_ratio: 0.1
    triplet_margin: 0.5 # Uniquement pour 'triplet' mode

  # --- Évaluation ---
  # 'ir' (InformationRetrieval) ou 'triplet' (TripletEvaluator)
  evaluator_type: "ir"  # Changed to Information Retrieval

  # Pour 'ir'
  metric_for_best_model: "validation-ir-eval_cosine_ndcg@10"
  # Pour 'triplet'
  #metric_for_best_model: "validation-set_cosine_accuracy" 
  
  # Où sauvegarder le modèle final de ce run
  model_output_dir: "./models" # Le run_id sera ajouté

# --- Phase 4: Rapport ---
reporting:
  report_file: "./results.csv"
